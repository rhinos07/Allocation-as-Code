# Which zone types and selection/placement strategies this building's
# search_rules and putaway_rules are allowed to use. Validates against
# schemas/fields.schema.json

fields:
  allowed_zone_types:
    - "activity_area"
    - "storage_type"
  allowed_selection_strategies:
    - "FEFO"
    - "FIFO"
    - "NEAREST_TO_TARGET"
  allowed_placement_strategies:
    - "ADD_TO_EXISTING"
    - "DELEGATE_TO_CONTROLLER"
    - "FIXED_BIN_FIRST"
    - "NEAREST_TO_OUTFEED"
    - "SPREAD_ACROSS_AISLES"
